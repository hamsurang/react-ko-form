name: Auto Translate (GitHub Models)

on:
  workflow_run:
    workflows: ["Update origin-src for Translation"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  models: read

jobs:
  auto-translate:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master-ko
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect changed files
        id: detect
        run: |
          set -Eeuo pipefail

          # origin/master의 최신 src/ 추출
          WORK=$(mktemp -d)
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          git archive origin/master src | tar -x -C "$WORK"

          # .mdx 파일만 체크섬 비교
          (cd "$WORK/src" && find . -name '*.mdx' -type f -print0 \
            | xargs -0 sha1sum | awk '{print $1" "$2}' | sort -k2) > master.sum || true
          (cd origin-src && find . -name '*.mdx' -type f -print0 \
            | xargs -0 sha1sum | awk '{print $1" "$2}' | sort -k2) > origin.sum || true

          # 추가된 파일 (A): master에만 존재
          comm -23 <(awk '{print $2}' master.sum | sort) <(awk '{print $2}' origin.sum | sort) \
            | while read -r f; do echo "A $f"; done > changes.list || true

          # 수정된 파일 (M): 양쪽에 존재하나 체크섬 다름
          join -j2 <(sort -k2 master.sum) <(sort -k2 origin.sum) \
            | awk '$2 != $3 {print "M "$1}' >> changes.list || true

          if [ -s changes.list ]; then
            echo "has_changes=true" >> "$GITHUB_ENV"
          else
            echo "has_changes=false" >> "$GITHUB_ENV"
          fi

          echo "=== Changed files ==="
          cat changes.list || echo "(none)"

      - name: Translate changed files
        if: env.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: |
          set -Eeuo pipefail

          # 번역 규칙 로드
          RULES=$(cat AGENTS.md)
          SKILL_RULES=$(cat .claude/skills/translate.md 2>/dev/null || echo "")

          read -r -d '' SYSTEM_PROMPT << 'SYSPROMPT' || true
          당신은 React Hook Form 문서 한국어 번역 전문가입니다. 아래 번역 규칙을 반드시 따르세요.

          <translation-rules>
          PLACEHOLDER_RULES
          </translation-rules>

          <additional-translation-guidelines>
          PLACEHOLDER_SKILL_RULES
          </additional-translation-guidelines>

          <tone-and-style-examples>
          아래는 기존 번역의 톤앤매너 예시입니다. 이 스타일을 따르세요.

          예시 1 (설명문):
          EN: This custom hook allows you to access the form context.
          KO: 이 커스텀 훅은 폼 컨텍스트에 접근할 수 있게 해줍니다.

          예시 2 (기술 용어 이중 표기):
          EN: The name of the registered input field.
          KO: 등록(register)된 인풋 필드의 이름입니다.

          예시 3 (Admonition 컴포넌트):
          EN: <Admonition type="important" title="Rules">You must wrap your form with FormProvider.</Admonition>
          KO: <Admonition type="important" title="Rules">`useFormContext`가 제대로 작동하려면, 먼저 폼을 [`FormProvider`](/docs/formprovider) 컴포넌트로 감싸야 합니다.</Admonition>

          예시 4 (Props 테이블):
          EN: | name | string | Required. The name of the input field. |
          KO: | name | string | 필수. 인풋 필드의 이름입니다. |

          예시 5 (코드 블록 주석만 번역):
          EN: // all useForm return props
          KO: // useForm이 반환하는 모든 props
          </tone-and-style-examples>

          중요:
          - 번역된 MDX 콘텐츠만 출력하세요. 코드 펜스로 감싸지 마세요.
          - 프론트매터의 title, description은 한국어로 번역하세요.
          - 코드 블록, JSX, import는 변경하지 마세요.
          - 마크다운 구조(헤딩, 리스트, 테이블)를 유지하세요.
          - 볼드 처리된 부제목(**Examples:**, **Return**, **Type** 등)은 번역하지 마세요. 영문 그대로 유지합니다.
          - 테이블 헤더(첫 번째 행)는 번역하지 마세요. 예: | Name | Type | Description | 은 영문 그대로 유지합니다.
          SYSPROMPT

          # 플레이스홀더를 실제 값으로 치환
          SYSTEM_PROMPT="${SYSTEM_PROMPT//PLACEHOLDER_RULES/$RULES}"
          SYSTEM_PROMPT="${SYSTEM_PROMPT//PLACEHOLDER_SKILL_RULES/$SKILL_RULES}"

          # API 호출 함수 (429 재시도 포함)
          call_api() {
            local user_msg="$1"
            local max_retries=5
            local retry=0
            local wait_sec=10

            while [ "$retry" -lt "$max_retries" ]; do
              local http_code
              local response
              local tmpfile
              tmpfile=$(mktemp)

              http_code=$(curl -s -o "$tmpfile" -w "%{http_code}" --max-time 120 \
                "https://models.github.ai/inference/chat/completions" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -d "$(jq -n \
                  --arg model "openai/gpt-4o-mini" \
                  --arg system "$SYSTEM_PROMPT" \
                  --arg user "$user_msg" \
                  '{model: $model, messages: [
                    {role: "system", content: $system},
                    {role: "user", content: $user}
                  ], max_tokens: 4096}')" 2>/dev/null) || http_code="000"

              response=$(cat "$tmpfile")
              rm -f "$tmpfile"

              # 429 rate limit → 대기 후 재시도
              if [ "$http_code" = "429" ]; then
                retry=$((retry + 1))
                echo "⚠️ API HTTP 429: Rate limited. ${wait_sec}초 대기 후 재시도 ($retry/$max_retries)..." >&2
                sleep "$wait_sec"
                wait_sec=$((wait_sec * 2))
                continue
              fi

              if [ "$http_code" != "200" ]; then
                echo "⚠️ API HTTP $http_code: $(echo "$response" | jq -r '.error.message // .message // "unknown error"' 2>/dev/null | head -1)" >&2
              fi
              printf '%s' "$response"
              return
            done

            # 모든 재시도 실패
            echo "⚠️ API 호출 실패: $max_retries회 재시도 후에도 429 에러" >&2
            echo '{}'
          }

          # 코드 펜스 제거 함수
          strip_fences() {
            sed '/^```\(mdx\|markdown\|md\)\?$/d; /^```$/d'
          }

          # 토큰 초과 에러 확인 함수 (413 + tokens_limit_reached 둘 다 감지)
          is_token_error() {
            local resp="$1"
            local err_code
            err_code=$(echo "$resp" | jq -r '.error.code // empty' 2>/dev/null)
            if echo "$err_code" | grep -q "tokens_limit_reached"; then
              return 0
            fi
            local err_msg
            err_msg=$(echo "$resp" | jq -r '.error.message // empty' 2>/dev/null)
            if echo "$err_msg" | grep -qi "too large\|max size"; then
              return 0
            fi
            return 1
          }

          # === diff 기반 패치 헬퍼 함수 ===

          # 줄 삽입: file의 line_num 뒤에 text_file 내용 삽입
          _insert_after() {
            local file="$1" line_num="$2" text_file="$3"
            local tmp=$(mktemp)
            if [ "$line_num" -eq 0 ]; then
              cat "$text_file" "$file" > "$tmp"
            else
              awk -v n="$line_num" -v tf="$text_file" '
                { print }
                NR == n { while ((getline line < tf) > 0) print line }
              ' "$file" > "$tmp"
            fi
            mv "$tmp" "$file"
          }

          # 줄 교체: file의 start~end 줄을 text_file 내용으로 교체
          _replace_range() {
            local file="$1" start="$2" end="$3" text_file="$4"
            local tmp=$(mktemp)
            awk -v s="$start" -v e="$end" -v tf="$text_file" '
              NR == s { while ((getline line < tf) > 0) print line }
              NR < s || NR > e { print }
            ' "$file" > "$tmp"
            mv "$tmp" "$file"
          }

          # 줄 삭제: file의 start~end 줄 삭제
          _delete_range() {
            local file="$1" start="$2" end="$3"
            local tmp=$(mktemp)
            awk -v s="$start" -v e="$end" 'NR < s || NR > e' "$file" > "$tmp"
            mv "$tmp" "$file"
          }

          # diff 기반 번역 및 패치
          # 변경된 줄만 API로 번역 → 한국어 파일에 프로그래밍 방식으로 적용
          translate_and_patch() {
            local old_en="$1" new_en="$2" ko_file="$3"

            # ed 스타일 diff (OLD 파일 기준 줄 번호 제공)
            local diff_out
            diff_out=$(diff "$old_en" "$new_en" 2>/dev/null) || true
            if [ -z "$diff_out" ]; then
              cat "$ko_file"; return 0
            fi

            # 1) 번역이 필요한 줄 수집 (> 로 시작하는 줄 = 추가/변경된 영문)
            local to_translate_file=$(mktemp)
            { echo "$diff_out" | grep '^> ' | sed 's/^> //' > "$to_translate_file"; } || true
            local total_lines=$(wc -l < "$to_translate_file" | tr -d ' ')

            # 2) 번역 API 호출 (변경된 줄만 전송)
            local translated_file=$(mktemp)
            if [ "$total_lines" -gt 0 ]; then
              local to_translate=$(cat "$to_translate_file")
              local user_msg="다음은 React Hook Form 영문 문서에서 추가/변경된 ${total_lines}줄입니다.
          각 줄을 한국어로 번역하세요.

          규칙:
          - 정확히 ${total_lines}줄을 출력하세요 (줄 수 변경 절대 금지)
          - 빈 줄도 그대로 빈 줄로 출력하세요
          - 마크다운 테이블 구문(|), HTML/JSX 태그, 코드는 변경 금지
          - 번역 결과만 출력 (코드 펜스, 설명, 번호 붙이기 금지)

          <lines>
          ${to_translate}
          </lines>"

              local response
              response=$(call_api "$user_msg")
              echo "$response" | jq -r '.choices[0].message.content // empty' | strip_fences > "$translated_file"

              # 줄 수 검증
              local translated_count=$(wc -l < "$translated_file" | tr -d ' ')
              if [ "$translated_count" -ne "$total_lines" ]; then
                echo "  ⚠️ 번역 줄 수 불일치 (기대: $total_lines, 실제: $translated_count)" >&2
              fi

              if [ ! -s "$translated_file" ]; then
                echo "  ⚠️ 번역 API 실패" >&2
                rm -f "$to_translate_file" "$translated_file"
                cat "$ko_file"; return 1
              fi
            fi

            # 3) diff 명령어 파싱 → 작업 목록 생성
            #    형식: "OP OLD_START OLD_END GT_LINE_START GT_LINE_END"
            local ops_file=$(mktemp)
            local gt_counter=0
            local prev_op="" prev_start="" prev_end="" prev_gt_start=""

            while IFS= read -r line; do
              if [[ "$line" =~ ^([0-9]+)(,([0-9]+))?([acd]) ]]; then
                if [ -n "$prev_op" ]; then
                  echo "$prev_op $prev_start $prev_end $prev_gt_start $gt_counter" >> "$ops_file"
                fi
                prev_op="${BASH_REMATCH[4]}"
                prev_start="${BASH_REMATCH[1]}"
                prev_end="${BASH_REMATCH[3]:-${BASH_REMATCH[1]}}"
                prev_gt_start=$((gt_counter + 1))
              elif [[ "$line" == "> "* ]]; then
                gt_counter=$((gt_counter + 1))
              fi
            done <<< "$diff_out"

            if [ -n "$prev_op" ]; then
              echo "$prev_op $prev_start $prev_end $prev_gt_start $gt_counter" >> "$ops_file"
            fi

            # 4) 한국어 파일에 변경 적용 (아래→위 순서로 줄 번호 보존)
            local work_file=$(mktemp)
            cp "$ko_file" "$work_file"

            tac "$ops_file" | while IFS=' ' read -r op start end gt_start gt_end; do
              case "$op" in
                d)
                  echo "  🗑️ 삭제: ${start}-${end}줄" >&2
                  _delete_range "$work_file" "$start" "$end"
                  ;;
                a)
                  echo "  ➕ 삽입: ${start}줄 뒤에 ${gt_start}-${gt_end}번 번역" >&2
                  local chunk_file=$(mktemp)
                  sed -n "${gt_start},${gt_end}p" "$translated_file" > "$chunk_file"
                  _insert_after "$work_file" "$start" "$chunk_file"
                  rm -f "$chunk_file"
                  ;;
                c)
                  echo "  🔄 교체: ${start}-${end}줄 → ${gt_start}-${gt_end}번 번역" >&2
                  local chunk_file=$(mktemp)
                  sed -n "${gt_start},${gt_end}p" "$translated_file" > "$chunk_file"
                  _replace_range "$work_file" "$start" "$end" "$chunk_file"
                  rm -f "$chunk_file"
                  ;;
              esac
            done

            cat "$work_file"
            rm -f "$to_translate_file" "$translated_file" "$ops_file" "$work_file"
          }

          # 헤딩 기준 청크 분할 함수
          split_by_heading() {
            local content="$1"
            local chunk_dir="$2"
            local pattern="$3"  # "h2" 또는 "h3"
            mkdir -p "$chunk_dir"

            local regex='^## '
            if [ "$pattern" = "h3" ]; then
              regex='^### '
            fi

            echo "$content" | awk -v re="$regex" '
              BEGIN { n=0; file="'"$chunk_dir"'/chunk_000.txt" }
              $0 ~ re { n++; file="'"$chunk_dir"'/chunk_" sprintf("%03d",n) ".txt" }
              { print >> file }
            '
          }

          # 단일 청크 번역 함수 (### 2차 분할 포함)
          # 사용법: translate_chunk "user_msg" "chunk_content" "fallback_text" "prompt_type"
          # prompt_type: "new" = 신규 번역, "modify" = 수정 번역
          # stdout: 번역 결과, 실패 시 fallback_text
          translate_chunk() {
            local user_msg="$1"
            local chunk_content="$2"
            local fallback_text="$3"
            local prompt_type="$4"
            local diff_text="$5"

            local response
            response=$(call_api "$user_msg")

            # 성공
            if ! is_token_error "$response"; then
              local result
              result=$(echo "$response" | jq -r '.choices[0].message.content // empty' 2>/dev/null)
              if [ -n "$result" ]; then
                echo "$result" | strip_fences
                return 0
              fi
              # API 에러 (토큰 초과 외)
              printf '%s' "$fallback_text"
              return 1
            fi

            # 토큰 초과 → ### 기준 2차 분할
            echo "  🔄 ### 기준 2차 분할 시도" >&2
            local sub_dir
            sub_dir=$(mktemp -d)
            split_by_heading "$chunk_content" "$sub_dir" "h3"

            local combined=""
            for sub_file in "$sub_dir"/chunk_*.txt; do
              local sub_chunk
              sub_chunk=$(cat "$sub_file")
              local sub_msg=""

              if [ "$prompt_type" = "new" ]; then
                sub_msg="다음 React Hook Form 문서 섹션을 한국어로 번역하세요. 이 섹션만 번역하여 출력하세요.

          <source>
          $sub_chunk
          </source>"
              else
                sub_msg="원본 영문 문서가 변경되었습니다. 아래 기존 한국어 번역 섹션에서 diff에 해당하는 부분만 업데이트하세요.
          변경이 없으면 기존 번역을 그대로 출력하세요. 이 섹션의 번역만 출력하세요.

          <diff>
          $diff_text
          </diff>

          <existing-korean-section>
          $sub_chunk
          </existing-korean-section>"
              fi

              local sub_resp
              sub_resp=$(call_api "$sub_msg")
              local sub_result
              sub_result=$(echo "$sub_resp" | jq -r '.choices[0].message.content // empty' 2>/dev/null)

              if [ -n "$sub_result" ]; then
                combined="${combined}$(echo "$sub_result" | strip_fences)
          "
              else
                echo "  ⚠️ 서브청크 번역 실패, 기존 유지: $(head -1 "$sub_file")" >&2
                combined="${combined}${sub_chunk}
          "
              fi
            done
            rm -rf "$sub_dir"
            printf '%s' "$combined"
          }

          TRANSLATED_COUNT=0
          : > translation_log.txt

          while IFS=' ' read -r kind file; do
            echo "📝 Processing: [$kind] $file"

            NEW_ORIGIN="$WORK/src/$file"
            if [ ! -f "$NEW_ORIGIN" ]; then
              echo "⚠️ 파일 없음: $NEW_ORIGIN"
              continue
            fi

            NEW_CONTENT=$(cat "$NEW_ORIGIN")
            TRANSLATED=""

            if [ "$kind" = "A" ]; then
              # --- 신규 번역 ---
              USER_MSG="다음 React Hook Form 문서를 한국어로 번역하세요.

          <source>
          $NEW_CONTENT
          </source>"

              RESPONSE=$(call_api "$USER_MSG")

              if is_token_error "$RESPONSE"; then
                echo "🔄 토큰 초과, ## 기준 청크 분할: $file"
                CHUNK_DIR=$(mktemp -d)
                split_by_heading "$NEW_CONTENT" "$CHUNK_DIR" "h2"

                TRANSLATED=""
                for chunk_file in "$CHUNK_DIR"/chunk_*.txt; do
                  CHUNK=$(cat "$chunk_file")
                  CHUNK_MSG="다음 React Hook Form 문서 섹션을 한국어로 번역하세요. 이 섹션만 번역하여 출력하세요.

          <source>
          $CHUNK
          </source>"
                  CHUNK_RESULT=$(translate_chunk "$CHUNK_MSG" "$CHUNK" "$CHUNK" "new" "")
                  TRANSLATED="${TRANSLATED}${CHUNK_RESULT}
          "
                done
                rm -rf "$CHUNK_DIR"
                echo "🆕 \`$file\` — 신규 번역 (청크 분할)" >> translation_log.txt
              else
                TRANSLATED=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null)
                echo "🆕 \`$file\` — 신규 번역" >> translation_log.txt
              fi

            elif [ "$kind" = "M" ]; then
              # --- 수정 번역 (diff 기반 패치) ---
              # 변경된 줄만 API로 번역하고, 프로그래밍 방식으로 한국어 파일에 적용
              OLD_ORIGIN_FILE="origin-src/$file"
              NEW_ORIGIN_FILE="$WORK/src/$file"
              KO_FILE="src/$file"

              if [ ! -f "$KO_FILE" ]; then
                echo "⏭️ 기존 번역 없음, 스킵: $file"
                continue
              fi

              if diff -q "$OLD_ORIGIN_FILE" "$NEW_ORIGIN_FILE" > /dev/null 2>&1; then
                echo "⏭️ diff 없음, 스킵: $file"
                continue
              fi

              # 변경된 줄 수 표시
              CHANGED_LINES=$(diff "$OLD_ORIGIN_FILE" "$NEW_ORIGIN_FILE" | grep -c '^> ' || true)
              echo "  🔧 diff 기반 패치: ${CHANGED_LINES}줄 번역 필요"

              TRANSLATED=$(translate_and_patch "$OLD_ORIGIN_FILE" "$NEW_ORIGIN_FILE" "$KO_FILE")
              echo "🔄 \`$file\` — diff 기반 변경점 반영 (${CHANGED_LINES}줄)" >> translation_log.txt

            else
              echo "⏭️ 알 수 없는 종류: $kind, 스킵"
              continue
            fi

            if [ -z "$TRANSLATED" ]; then
              echo "⚠️ 번역 실패: $file"
              continue
            fi

            # 코드 펜스 래퍼 제거
            TRANSLATED=$(echo "$TRANSLATED" | strip_fences)

            # 번역 결과 저장
            TARGET="src/$file"
            mkdir -p "$(dirname "$TARGET")"
            printf '%s\n' "$TRANSLATED" > "$TARGET"
            TRANSLATED_COUNT=$((TRANSLATED_COUNT + 1))
            echo "✅ 번역 완료: $file"

            # Rate limit 방지: 파일 간 대기
            sleep 5

          done < changes.list

          echo "translated_count=$TRANSLATED_COUNT" >> "$GITHUB_ENV"
          echo "=== 번역 완료: ${TRANSLATED_COUNT}개 파일 ==="

          if [ "$TRANSLATED_COUNT" -eq 0 ]; then
            echo "❌ 모든 파일 번역 실패. API 응답을 확인하세요."
            exit 1
          fi

      - name: Create translation PR
        if: env.has_changes == 'true' && env.translated_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          # 변경사항 확인
          git add src/content/
          if git diff --cached --quiet; then
            echo "번역된 변경사항 없음, PR 생성 스킵"
            exit 0
          fi

          # 기존 자동 번역 PR이 있으면 닫기
          EXISTING_PR=$(gh pr list --search "head:auto-translate-github-" \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            gh pr close "$EXISTING_PR" --comment "새로운 자동 번역 PR로 대체합니다." || true
          fi

          DATE_STR=$(date +%Y-%m-%d)

          # 브랜치 생성 & 커밋
          BRANCH="auto-translate-github-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "docs: GitHub Models API 자동 번역 (${DATE_STR})"

          # 푸시
          git push origin "$BRANCH"

          # PR 본문 생성 - translation_log.txt에서 상세 내역 읽기
          TRANSLATION_DETAILS=$(cat translation_log.txt 2>/dev/null || echo "(상세 내역 없음)")

          gh pr create \
            --title "docs: 자동 번역 업데이트 (${DATE_STR})" \
            --body "$(cat <<EOF
          ## 자동 번역 (GitHub Models API)

          ### 번역 상세 내역
          $TRANSLATION_DETAILS

          ### 사용 모델
          - \`openai/gpt-4o-mini\` via GitHub Models API

          ### 참고
          - 번역 규칙: \`AGENTS.md\`, \`.claude/skills/translate.md\`
          - 이 PR은 자동 생성되었습니다. 리뷰 후 머지해주세요.
          EOF
          )" \
            --base master-ko \
            --head "$BRANCH"
